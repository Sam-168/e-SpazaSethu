# ============================================================
# e-SpazaSethu ? Spring Boot Application Configuration
# ============================================================
# This file is committed to GitHub.
# It contains NO sensitive values ? only placeholders.
# Sensitive values live in application-local.properties
# which is listed in .gitignore and never committed.
# ============================================================

spring.application.name=backend
# ------------------------------------------------------------
# SERVER
# ------------------------------------------------------------
server.port=${SERVER_PORT:8080}


# ------------------------------------------------------------
# DATABASE
# ------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/espaza_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ------------------------------------------------------------
# JPA / HIBERNATE
# ------------------------------------------------------------

# validate ? Hibernate checks the schema matches the entities
# but does NOT create or alter tables. schema.sql handles that.
spring.jpa.hibernate.ddl-auto=validate

# Show SQL in the console during development (set to false in production)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# ------------------------------------------------------------
# JWT
# ------------------------------------------------------------
app.jwt.secret=${JWT_SECRET}
app.jwt.expiry-hours=${JWT_EXPIRY_HOURS:8}


# ------------------------------------------------------------
# CORS
# ------------------------------------------------------------
app.cors.allowed-origin=${ALLOWED_ORIGIN:http://localhost:5173}


# ------------------------------------------------------------
# SCHEMA INITIALISATION
# ------------------------------------------------------------

# Tell Spring Boot to run schema.sql on startup.
# 'always' means it runs every time ? safe because our schema.sql
# uses CREATE TABLE IF NOT EXISTS style via the schema file.
# Switch to 'never' once your tables are created and stable.
spring.sql.init.mode=never
spring.sql.init.schema-locations=classpath:schema.sql

# Ensure schema.sql runs before JPA tries to validate
spring.jpa.defer-datasource-initialization=true


# ------------------------------------------------------------
# ACTIVE PROFILE
# ------------------------------------------------------------

# This loads application-local.properties on top of this file.
# Values in application-local.properties override values here.
spring.profiles.active=local
